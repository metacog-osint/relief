name: update
# Written 16 Nov 2026, modelled on Undertow's; live since 15 Nov 2026 (repo, Pages project and secrets exist).
# Every 6 hours (to be started by the hub's tic-dispatch Worker, because GitHub fires schedules 4-9 h
# late; its own cron is the fallback), on every push to main, and by hand: the tests, the last run's snapshot from
# the Actions cache, a live collection, the build and check, the history log, then a deploy of site/ to Cloudflare
# Pages.
#
# State: a failed lane keeps its last good copy, which needs the run before's data/snapshot.json. It holds only
# derived records (no WHO notice text) and is kept in the Actions cache. The raw replies in data/raw/ are never
# cached, committed or published (neither publisher allows bulk reposting). The full IFRC appeal records (every
# version, the ten-year read included) are kept only in the private archive; history/ holds an index and counts.
#
# Secrets: CLOUDFLARE_PAGES_TOKEN (Cloudflare Pages: Edit) and repo variable CLOUDFLARE_ACCOUNT_ID. Without them
# everything runs except the deploy. HDX_HAPI_APP_IDENTIFIER and RELIEFWEB_APPNAME (added 18 Nov 2026) go to the
# collect step for the hapi and reliefweb lanes, and to both checks, whose terms scan fails the build if either
# value reaches the published files. A lane whose key is missing fails on its own and keeps its last good copy.
#
# Private archive (the last two steps): every run's raw replies, history/, run snapshot and deployed site/ also go
# to the PRIVATE repo metacog-osint/tic-archive (tools/tic_archive.py), where nothing is replaced or deleted. The
# snapshot and site/ are otherwise kept only for a while (the Actions cache) or replaced by the next deploy, and the
# archive keeps every version. When the cache has no snapshot, the newest one in the archive is used.
#
# PROJECT below is the Pages project name.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write     # the history/ commit
concurrency:
  group: update
  cancel-in-progress: false
env:
  PROJECT: relief
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Tests (offline, cut-down recorded replies)
        run: python -m unittest discover -s tests
      - name: Doctrine registers, and the vendored kit copy unedited
        run: |
          python doctrine/kit/tic.py registers doctrine
          python doctrine/kit/tic.py kitcheck
      - name: Last run's snapshot from the Actions cache (none on the first run)
        id: state
        uses: actions/cache/restore@v6
        with:
          path: data/snapshot.json
          key: relief-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: relief-state-
      # Then the private archive: its lane `state` holds the snapshot of every run whose first check passed. The
      # restore goes to a temporary folder and only its snapshot.json is copied into data/, once the restore finished.
      - name: No cache entry, so the snapshot from the private archive (or none)
        if: steps.state.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ] && python tools/tic_archive.py restore --program relief --lane state \
               --dest "$RUNNER_TEMP/archive-state" && [ -f "$RUNNER_TEMP/archive-state/snapshot.json" ]; then
            mkdir -p data && cp "$RUNNER_TEMP/archive-state/snapshot.json" data/snapshot.json
            echo "::warning::No snapshot in the Actions cache; restored the newest copy kept in the private archive."
          else
            echo "::warning::No snapshot in the Actions cache or the private archive, so a lane that fails this run has no last good copy."
          fi
      - name: Live collection (a failed lane keeps its last good copy and says so on the page)
        env:
          HDX_HAPI_APP_IDENTIFIER: ${{ secrets.HDX_HAPI_APP_IDENTIFIER }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python tools/relief.py collect
      - name: Build site/
        run: python tools/relief.py build
      - name: Check (registers, feed linter, terms scan)
        id: check
        env:
          HDX_HAPI_APP_IDENTIFIER: ${{ secrets.HDX_HAPI_APP_IDENTIFIER }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python tools/relief.py check
      - name: History (history/, and site/data/ended.geojson)
        id: history
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}   # only for the private appeals copy below; git push does not use it
        run: |
          git fetch -q --depth=1 origin main && git checkout -q FETCH_HEAD -- history 2>/dev/null \
            || echo "::warning::could not take history/ from main's tip; using this checkout's"
          # Retention archives (history/appeals-index, who-notices, funding, reliefweb-counts .jsonl, and
          # appeals-counts.json): append-only, written on top of main's tip just taken, then committed below with the
          # rest of history/. For IFRC appeals the public files are an index (id, hash, link) and counts only.
          python tools/relief.py archive || echo "::warning::archive step failed; this run is missing from the archives"
          # Full IFRC appeal records (24 Nov 2026): never in this public repo. The one append-only file lives in the
          # PRIVATE repo metacog-osint/tic-archive (lane relief-appeals): restored, appended to, uploaded again. The old
          # public history/appeals.jsonl is folded in line for line and removed (retire-legacy) only after the upload
          # succeeded, so the commit below drops it from main's tip; git history keeps its past versions. A failure
          # here leaves the public file in place, never stops the deploy, and turns the run red in the last step.
          rm -rf data/private && mkdir -p data/private/appeals
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so the full appeal records were not archived"
            touch data/private/appeals-failed
          elif python tools/tic_archive.py restore --program relief --lane appeals --dest data/private/appeals \
            && python tools/relief.py archive-full --dir data/private/appeals \
            && python tools/tic_archive.py put --program relief --lane appeals --src data/private/appeals \
            && python tools/relief.py retire-legacy --dir data/private/appeals; then
            echo "appeals: full records are in the private archive"
          else
            echo "::error::the full appeal records did not reach the private archive this run; the next run retries"
            touch data/private/appeals-failed
          fi
          python doctrine/kit/tic.py history site/data/feed.geojson --dir history --ended site/data/ended.geojson --fill-last-change \
            || { echo "::warning::history step failed; this run is missing from history/"; exit 0; }
          git config user.name "relief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp="history: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin main && git reset -q --mixed FETCH_HEAD || { sleep $((i * 15)); continue; }
            git add history
            git diff --cached --quiet -- history && { echo "history: nothing new"; exit 0; }
            git commit -q -m "$stamp" && git push -q origin HEAD:main && exit 0
            echo "::warning::history push attempt $i failed"
            sleep $((i * 15))
          done
          echo "::warning::history not committed this run; the next run logs these changes again from the last state"
      - name: Check again, now with site/data/ended.geojson in the terms scan
        env:
          HDX_HAPI_APP_IDENTIFIER: ${{ secrets.HDX_HAPI_APP_IDENTIFIER }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python tools/relief.py check
      - name: Keep this run's snapshot for the next run
        uses: actions/cache/save@v6
        with:
          path: data/snapshot.json
          key: relief-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy site/ to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy"; exit 0
          fi
          # Cloudflare's API fails now and then with nothing wrong here ("An unknown error occurred ... [code: 8000000]"),
          # which failed the run and mailed an alert. Try three times, 20 s and 60 s apart.
          for wait in 0 20 60; do
            if [ "$wait" != 0 ]; then echo "::warning::Cloudflare deploy failed; trying again in ${wait} s"; sleep "$wait"; fi
            if npx --yes wrangler@4.151.3 pages deploy site --project-name "$PROJECT" --branch main \
                 --commit-hash "$GITHUB_SHA" --commit-message "update $GITHUB_SHA" --commit-dirty=true; then
              exit 0
            fi
          done
          echo "::error::Cloudflare Pages deploy failed three times"; exit 1
      # Private archive (19 Nov 2026, retention rule: no data lost). WHO's and ReliefWeb's terms bar redistribution,
      # and HAPI returns current values only, so the raw replies of all four lanes (IFRC, WHO DON, HAPI, ReliefWeb)
      # go to the PRIVATE repo metacog-osint/tic-archive as release assets (tools/tic_archive.py, release
      # relief-raw-YYYY-MM: a snapshot per run, only changed replies uploaded). Never to this public repo's releases,
      # artifacts or logs. ReliefWeb echoes the appname in href/links: it (and the HAPI identifier, if a reply ever
      # echoes it) is replaced by REDACTED first, and the snapshot marks each changed file.
      # After the deploy, so a failure turns the run red but never holds the live site. Token: TIC_ARCHIVE_TOKEN,
      # contents:write on tic-archive only.
      - name: Private archive (raw replies, to tic-archive)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          HDX_HAPI_APP_IDENTIFIER: ${{ secrets.HDX_HAPI_APP_IDENTIFIER }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so nothing went to the private archive"; exit 1
          fi
          python tools/tic_archive.py put --program relief --lane raw --src data/raw \
            --redact-env-if-set RELIEFWEB_APPNAME --redact-param appname \
            --redact-env-if-set HDX_HAPI_APP_IDENTIFIER --redact-param app_identifier
          if [ -e data/private/appeals-failed ]; then
            echo "::error::the full IFRC appeal records did not reach the private archive (see the History step)"; exit 1
          fi
      # What this public repository keeps only for a while or replaces, to the same private archive, one lane each
      # (release relief-<lane>-YYYY-MM; a snapshot per run, only changed files uploaded, nothing replaced):
      #   history  history/ as the History step left it: the history log, the retention files, the kit's
      #            state.json. Committed to main too. Only when that step ran, so a run that stopped earlier never
      #            archives an older checkout's history/ as the newest snapshot.
      #   state    data/ without data/raw (lane raw) and data/private (lane appeals): the run snapshot, which the
      #            Actions cache keeps for 7 days. Only once the first check passed, so it is a snapshot the next run
      #            may use (the step after the cache restore reads it when the cache has none). The keys are
      #            removed as in lane raw, though collect never writes them there.
      #   site     site/ as deployed: every published file, feed.geojson and ended.geojson (COP) among them, each
      #            replaced by the next deploy. Only when the deploy step succeeded.
      # history/ and site/ are public already, so they are archived as they are and match the public copy by hash.
      # Each lane is tried even if another failed; any failure turns the run red after the live site is updated.
      - name: Private archive (history, run snapshot and site, to tic-archive)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          HDX_HAPI_APP_IDENTIFIER: ${{ secrets.HDX_HAPI_APP_IDENTIFIER }}
          HISTORY: ${{ steps.history.outcome }}
          CHECKED: ${{ steps.check.outcome }}
          DEPLOYED: ${{ steps.deploy.outcome }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so history/, the run snapshot and site/ did not reach the private archive"; exit 1
          fi
          failed=0
          if [ "$HISTORY" = "success" ]; then
            python tools/tic_archive.py put --program relief --lane history --src history || failed=1
          else
            echo "history: the History step did not run, so history/ was not archived"
          fi
          if [ "$CHECKED" = "success" ]; then
            python tools/tic_archive.py put --program relief --lane state --src data --exclude 'raw/*' \
              --exclude 'private/*' --redact-env-if-set RELIEFWEB_APPNAME --redact-param appname \
              --redact-env-if-set HDX_HAPI_APP_IDENTIFIER --redact-param app_identifier || failed=1
          else
            echo "state: the first check did not pass this run, so the snapshot was not archived"
          fi
          if [ "$DEPLOYED" = "success" ]; then
            python tools/tic_archive.py put --program relief --lane site --src site || failed=1
          else
            echo "site: not deployed this run, so not archived"
          fi
          if [ "$failed" != 0 ]; then
            echo "::error::a lane did not reach the private archive this run (see above)"; exit 1
          fi
